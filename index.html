<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Car Racing Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }
        /* Mobile Touch Controls */
        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 10;
        }
        .btn {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid white;
            border-radius: 50%;
            color: white;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: pointer;
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="scoreDisplay">Score: 0</div>
    </div>

    <div id="controls">
        <div class="btn" id="leftBtn">&larr;</div>
        <div class="btn" id="rightBtn">&rarr;</div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);
        scene.fog = new THREE.Fog(0x111122, 10, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(0, 20, 10);
        scene.add(dirLight);

        // Road
        const roadGeo = new THREE.PlaneGeometry(8, 100);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -40;
        scene.add(road);

        // Player Car (Red)
        const carGroup = new THREE.Group();
        const bodyGeo = new THREE.BoxGeometry(1.2, 0.5, 2.5);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0000, metalness: 0.5 });
        const carBody = new THREE.Mesh(bodyGeo, bodyMat);
        carBody.position.y = 0.3;
        carGroup.add(carBody);

        const topGeo = new THREE.BoxGeometry(0.9, 0.4, 1.3);
        const topMat = new THREE.MeshStandardMaterial({ color: 0xdd0000 });
        const carTop = new THREE.Mesh(topGeo, topMat);
        carTop.position.set(0, 0.7, -0.1);
        carGroup.add(carTop);

        carGroup.position.set(0, 0, 5);
        scene.add(carGroup);

        camera.position.set(0, 3.5, 9);
        camera.lookAt(0, 0, 0);

        // Obstacle Cars
        let obstacles = [];
        let score = 0;
        let gameOver = false;

        function spawnObstacle() {
            if (gameOver) return;
            const obsGeo = new THREE.BoxGeometry(1.2, 0.5, 2.5);
            const obsMat = new THREE.MeshStandardMaterial({ color: 0xffcc00 });
            const obs = new THREE.Mesh(obsGeo, obsMat);
            
            const lanes = [-2.5, 0, 2.5];
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
            obs.position.set(randomLane, 0.3, -40);
            
            scene.add(obs);
            obstacles.push(obs);

            setTimeout(spawnObstacle, 2000);
        }
        spawnObstacle();

        // Controls State
        let moveLeft = false;
        let moveRight = false;

        document.getElementById("leftBtn").addEventListener("touchstart", () => moveLeft = true);
        document.getElementById("leftBtn").addEventListener("touchend", () => moveLeft = false);
        document.getElementById("rightBtn").addEventListener("touchstart", () => moveRight = true);
        document.getElementById("rightBtn").addEventListener("touchend", () => moveRight = false);

        // Keyboard support for PC
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") moveLeft = true;
            if (e.key === "ArrowRight") moveRight = true;
        });
        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft") moveLeft = false;
            if (e.key === "ArrowRight") moveRight = false;
        });

        // Game Loop
        function animate() {
            if (gameOver) return;
            requestAnimationFrame(animate);

            // Move car smoothly
            if (moveLeft && carGroup.position.x > -3) carGroup.position.x -= 0.15;
            if (moveRight && carGroup.position.x < 3) carGroup.position.x += 0.15;

            // Move obstacles towards player
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].position.z += 0.4;

                // Collision Detection
                if (Math.abs(carGroup.position.x - obstacles[i].position.x) < 0.9 &&
                    Math.abs(carGroup.position.y - obstacles[i].position.y) < 0.5 &&
                    Math.abs(carGroup.position.z - obstacles[i].position.z) < 1.5) {
                    gameOver = true;
                    alert("Game Over! Score: " + score);
                    location.reload();
                }

                // Remove passed obstacles & update score
                if (obstacles[i].position.z > 10) {
                    scene.remove(obstacles[i]);
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById("scoreDisplay").innerText = "Score: " + score;
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
