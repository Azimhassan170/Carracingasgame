<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Car Racing Game</title>
    <style>
        body { text-align: center; background: #222; color: white; font-family: sans-serif; }
        canvas { background: #555; display: block; margin: 20px auto; border: 2px solid white; }
    </style>
</head>
<body>
    <h2>Simple Car Racing Game</h2>
    <canvas id="gameCanvas" width="300" height="500"></canvas>
    <p>Use Arrow Keys (Left / Right) to move the car!</p>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let carX = 130;
        let carY = 400;
        let carWidth = 40;
        let carHeight = 70;

        let obstacleX = Math.floor(Math.random() * 250);
        let obstacleY = -100;
        let obstacleWidth = 40;
        let obstacleHeight = 70;
        let score = 0;

        let rightPressed = false;
        let leftPressed = false;

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight") rightPressed = true;
            if (e.key === "ArrowLeft") leftPressed = true;
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowRight") rightPressed = false;
            if (e.key === "ArrowLeft") leftPressed = false;
        });

        function update() {
            if (rightPressed && carX < canvas.width - carWidth) carX += 5;
            if (leftPressed && carX > 0) carX -= 5;

            obstacleY += 4;
            if (obstacleY > canvas.height) {
                obstacleY = -100;
                obstacleX = Math.floor(Math.random() * (canvas.width - obstacleWidth));
                score++;
            }

            // Collision detection
            if (
                carX < obstacleX + obstacleWidth &&
                carX + carWidth > obstacleX &&
                carY < obstacleY + obstacleHeight &&
                carY + carHeight > obstacleY
            ) {
                alert("Game Over! Score: " + score);
                carX = 130;
                obstacleY = -100;
                score = 0;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Car
            ctx.fillStyle = "red";
            ctx.fillRect(carX, carY, carWidth, carHeight);

            // Draw Obstacle Car
            ctx.fillStyle = "yellow";
            ctx.fillRect(obstacleX, obstacleY, obstacleWidth, obstacleHeight);

            // Draw Score
            ctx.fillStyle = "white";
            ctx.font = "16px Arial";
            ctx.fillText("Score: " + score, 10, 20);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
